# This rule is not used by the project workspace-nscmv5 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over argocdcommenter.int128.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: workspace-nscmv5
    app.kubernetes.io/managed-by: kustomize
  name: applicationhealth-admin-role
rules:
- apiGroups:
  - argocdcommenter.int128.github.io
  resources:
  - applicationhealths
  verbs:
  - '*'
- apiGroups:
  - argocdcommenter.int128.github.io
  resources:
  - applicationhealths/status
  verbs:
  - get
